author:
  - name: Santiago Botero Sierra
    email: sboteros@unal.edu.co
date-modified: last-modified
lang: es
execute:
  echo: true
  warning: false
freeze: true
bibliography: bibliografia.bib

filters: 
  - pseudocode

format:
  html:
    code-fold: true
    code-summary: 'Ver el código'
    code-tools: true
    source: repo
    number-sections: true
    include-in-header:
      text: |
        <script>
        MathJax = {
          loader: {
            load: ['[tex]/boldsymbol']
          },
          tex: {
            tags: "all",
            inlineMath: [['$','$'], ['\\(','\\)']],
            displayMath: [['$$','$$'], ['\\[','\\]']],
            processEscapes: true,
            processEnvironments: true,
            packages: {
              '[+]': ['boldsymbol']
            }
          }
        };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js" type="text/javascript"></script>

pseudocode:
  caption-prefix: 'Algoritmo'
  reference-prefix: 'Algoritmo'
  caption-number: true